<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AI</title>
  <style>
    :root {
      --bg: #0a0b10;
      --slate: #12141d;
      --slate-2: #171a26;
      --neon: #00f2fe;
      --blue: #4facfe;
      --fg: #eef1f8;
      --muted: #6e7490;
      --border: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(0, 242, 254, 0.35);
      --danger: #ff4d6d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    /* ── Ambient glowing background blurs ── */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 560px; height: 560px;
      top: -180px; right: -120px;
      background: rgba(0, 242, 254, 0.22);
    }
    body::after {
      width: 520px; height: 520px;
      bottom: -180px; left: -120px;
      background: rgba(79, 172, 254, 0.20);
    }

    .panel {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 860px;
      height: min(92vh, 860px);
      display: flex;
      flex-direction: column;
      background: rgba(18, 20, 29, 0.45);
      border: 1px solid var(--border);
      border-radius: 20px;                       /* rounded corners 20px */
      backdrop-filter: blur(25px);               /* heavy glass blur */
      -webkit-backdrop-filter: blur(25px);
      overflow: hidden;
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.05);
    }

    /* ── Header ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 40px; height: 40px; border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--neon), var(--blue));
      color: #02131c; font-weight: 800; font-size: 18px;
      box-shadow: 0 0 26px var(--border-glow);
    }
    .brand-text { display: flex; flex-direction: column; }
    .brand-text h1 { font-size: 19px; font-weight: 700; letter-spacing: 0.5px; }
    .brand-text span { font-size: 10.5px; color: var(--muted); letter-spacing: 1.6px; }

    .status { display: flex; align-items: center; gap: 8px; }
    .status-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 12px var(--danger);
      transition: all 0.3s;
    }
    .status-label { font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
    .online .status-dot { background: var(--neon); box-shadow: 0 0 14px var(--neon); }
    .online .status-label { color: var(--neon); }

    /* ── Chat area ── */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    .chat::-webkit-scrollbar { width: 7px; }
    .chat::-webkit-scrollbar-thumb { background: var(--slate-2); border-radius: 8px; }
    .chat::-webkit-scrollbar-thumb:hover { background: rgba(110, 116, 144, 0.6); }

    /* Assistant messages: JARVIS badge + glass bubble, left-aligned */
    .msg.assistant {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }
    .jarvis-badge {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800;
      background: linear-gradient(135deg, var(--neon), var(--blue));
      color: #02131c;
      box-shadow: 0 0 18px var(--border-glow);
    }
    .msg.assistant .bubble {
      max-width: 68%;
      padding: 11px 15px;
      font-size: 13.5px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* User messages: YOU tag strictly right-aligned with gradient bubble */
    .msg.user {
      display: flex;
      justify-content: flex-end;
    }
    .user-block {
      display: flex;
      flex-direction: column;
      align-items: flex-end;         /* tag + bubble hug the right edge */
      gap: 4px;
      max-width: 68%;
    }
    .user-tag {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 1.6px;
      color: rgba(0, 242, 254, 0.85);
      padding-right: 4px;
    }
    .msg.user .bubble {
      padding: 11px 15px;
      font-size: 13.5px;
      line-height: 1.45;
      word-break: break-word;
      background: linear-gradient(135deg, var(--neon), var(--blue));
      color: #02131c;
      font-weight: 600;
      border-radius: 16px 4px 16px 16px;
      box-shadow: 0 4px 18px rgba(0, 242, 254, 0.22);
    }

    /* Typing indicator */
    .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
    .typing i:nth-child(2) { animation-delay: 0.2s; }
    .typing i:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

    /* ── Quick actions dock: horizontal scrollable row ── */
    .dock {
      padding: 12px 24px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.015);
    }
    .dock-chips {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .dock-chips::-webkit-scrollbar { height: 4px; }
    .dock-chips::-webkit-scrollbar-thumb { background: var(--slate-2); border-radius: 4px; }
    .chip {
      flex-shrink: 0;
      padding: 8px 15px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      background: var(--slate);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: all 0.2s;
    }
    .chip:hover {
      color: #02131c;
      background: linear-gradient(135deg, var(--neon), var(--blue));
      border-color: transparent;
      box-shadow: 0 0 18px var(--border-glow);   /* glowing hover */
      transform: translateY(-1px);
    }

    /* ── Input section: integrated pill ── */
    .input-wrap { padding: 16px 24px; background: rgba(255, 255, 255, 0.02); }
    .input-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 6px 6px 16px;
      background: var(--slate);
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-pill:focus-within {
      border-color: var(--neon);
      box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.12), 0 0 22px var(--border-glow);
    }
    .input-pill input {
      flex: 1;
      min-width: 0;
      padding: 10px 8px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--fg);
      font-size: 13.5px;
      font-family: inherit;
    }
    .input-pill input::placeholder { color: var(--muted); }

    .icon-btn {
      width: 38px; height: 38px; flex-shrink: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      background: transparent; color: var(--muted);
      border: none; border-radius: 50%;
      transition: all 0.18s;
    }
    .icon-btn:hover { color: var(--neon); background: rgba(0, 242, 254, 0.08); }
    .icon-btn.active { color: #fff; background: var(--danger); box-shadow: 0 0 16px rgba(255,77,109,0.45); }

    .send-btn {
      height: 38px; padding: 0 20px; flex-shrink: 0; cursor: pointer;
      background: linear-gradient(135deg, var(--neon), var(--blue));
      color: #02131c; border: none; border-radius: 999px;
      font-family: inherit; font-weight: 700; font-size: 13px;
      transition: all 0.18s;
    }
    .send-btn:hover { filter: brightness(1.08); box-shadow: 0 0 20px var(--border-glow); transform: translateY(-1px); }

    .mic-hint { font-size: 10.5px; color: var(--muted); text-align: center; padding: 4px 24px 0; min-height: 15px; }

    @media (max-width: 560px) {
      body { padding: 10px; }
      .panel { height: 96vh; border-radius: 16px; }
      .msg.assistant .bubble, .user-block { max-width: 82%; }
      .input-wrap { padding: 12px; }
      .dock { padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <div class="panel">
    <!-- HEADER -->
    <div class="header">
      <div class="brand">
        <div class="brand-icon">J</div>
        <div class="brand-text">
          <h1>JARVIS</h1>
          <span>PERSONAL AI ASSISTANT</span>
        </div>
      </div>
      <div class="status" id="status">
        <span class="status-dot"></span>
        <span class="status-label">Connecting…</span>
      </div>
    </div>

    <!-- CHAT -->
    <div class="chat" id="chat"></div>

    <!-- QUICK ACTIONS DOCK -->
    <div class="dock">
      <div class="dock-chips">
        <button class="chip" data-cmd="open youtube">▶ YouTube</button>
        <button class="chip" data-cmd="open terminal">⌘ Terminal</button>
        <button class="chip" data-cmd="open finder">Finder</button>
        <button class="chip" data-cmd="open spotify">♫ Spotify</button>
        <button class="chip" data-cmd="mute">Mute</button>
        <button class="chip" data-cmd="unmute">Unmute</button>
        <button class="chip" data-cmd="system check">📊 System Check</button>
      </div>
    </div>

    <!-- INPUT PILL -->
    <div class="input-wrap">
      <div class="input-pill">
        <button class="icon-btn" id="mic-btn" title="Voice input" aria-label="Voice input">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
            <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
            <line x1="12" y1="18" x2="12" y2="22"/>
          </svg>
        </button>
        <input id="cmd-input" type="text" placeholder="Command JARVIS…" autocomplete="off">
        <button class="send-btn" id="send-btn">Send</button>
      </div>
      <div class="mic-hint" id="mic-hint"></div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      var chat    = document.getElementById("chat");
      var input   = document.getElementById("cmd-input");
      var sendBtn = document.getElementById("send-btn");
      var micBtn  = document.getElementById("mic-btn");
      var micHint = document.getElementById("mic-hint");
      var status  = document.getElementById("status");

      // ---------- Voice input (Web Speech API) ----------
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      var recognition = SR ? new SR() : null;
      var isListening = false;

      function setListening(state) {
        isListening = state;
        micBtn.classList.toggle("active", state);
        micHint.textContent = state ? "Listening… speak now." : "";
      }

      if (recognition) {
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = "en-US";
        recognition.onresult = function (event) {
          var transcript = event.results[0][0].transcript.trim();
          if (transcript) sendCommand(transcript);
        };
        recognition.onerror = function (event) {
          setListening(false);
          micHint.textContent =
            event.error === "not-allowed" ? "Microphone access blocked." :
            event.error === "no-speech"   ? "No speech detected. Try again." :
            "Voice error: " + event.error;
        };
        recognition.onend = function () { setListening(false); };
      } else {
        micHint.textContent = "Voice input not supported in this browser.";
      }

      micBtn.addEventListener("click", function () {
        if (!recognition) return;
        if (isListening) { recognition.stop(); setListening(false); }
        else {
          try { recognition.start(); setListening(true); }
          catch (e) { micHint.textContent = "Voice already active — try once more."; }
        }
      });

      // ---------- Rendering ----------
      function scrollToBottom() {
        chat.scrollTo({ top: chat.scrollHeight, behavior: "smooth" });
      }

      function appendAssistant(text) {
        var msg = document.createElement("div");
        msg.className = "msg assistant";
        var badge = document.createElement("div");
        badge.className = "jarvis-badge";
        badge.textContent = "J";
        var bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        msg.appendChild(badge);
        msg.appendChild(bubble);
        chat.appendChild(msg);
        scrollToBottom();
      }

      function appendUser(text) {
        var msg = document.createElement("div");
        msg.className = "msg user";
        var block = document.createElement("div");
        block.className = "user-block";
        var tag = document.createElement("span");
        tag.className = "user-tag";
        tag.textContent = "YOU";
        var bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        block.appendChild(tag);
        block.appendChild(bubble);
        msg.appendChild(block);
        chat.appendChild(msg);
        scrollToBottom();
      }

      function appendTyping() {
        var msg = document.createElement("div");
        msg.className = "msg assistant";
        msg.id = "typing-msg";
        msg.innerHTML =
          '<div class="jarvis-badge">J</div>' +
          '<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
        chat.appendChild(msg);
        scrollToBottom();
      }

      function removeTyping() {
        var t = document.getElementById("typing-msg");
        if (t) t.remove();
      }

      // ---------- API ----------
      function sendCommand(text) {
        var value = (text || "").trim();
        if (!value) return;
        input.value = "";
        appendUser(value);
        appendTyping();

        fetch("/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command: value })
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            removeTyping();
            var reply = (data && data.status === "success")
              ? data.message
              : (data && data.message ? "Error: " + data.message : "Error: Unknown response");
            appendAssistant(reply);
          })
          .catch(function () {
            removeTyping();
            appendAssistant("Error communicating with the server. Is JARVIS running?");
          });
      }

      // ---------- Events ----------
      sendBtn.addEventListener("click", function () { sendCommand(input.value); });
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") sendCommand(input.value);
      });
      document.querySelectorAll(".chip").forEach(function (chip) {
        chip.addEventListener("click", function () {
          sendCommand(chip.getAttribute("data-cmd"));
        });
      });

      // ---------- Health check + welcome ----------
      fetch("/api/ping")
        .then(function (res) { return res.json(); })
        .then(function () {
          status.classList.add("online");
          document.querySelector(".status-label").textContent = "Ready";
        })
        .catch(function () {
          status.classList.remove("online");
          document.querySelector(".status-label").textContent = "Offline";
        });

      appendAssistant("System online. Welcome back, sir. How may I assist you?");
    })();
  </script>
</body>
</html>
