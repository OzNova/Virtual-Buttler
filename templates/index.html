<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AI</title>
  <style>
    :root {
      --bg: #05060a;
      --bg-secondary: #0d0f17;
      --bg-tertiary: #161a26;
      --card: radial-gradient(circle at 20% 0%, #111423, #0b0d16 70%);
      --fg: #e8eaf3;
      --muted: #6b7288;
      --accent: #00ffcc;
      --accent-2: #7aa2ff;
      --border: rgba(255,255,255,0.06);
      --border-glow: rgba(0,255,204,0.25);
      --danger: #ff4d6d;
      --radius: 18px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(0,255,204,0.12), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(122,162,255,0.10), transparent 60%),
        var(--bg);
      color: var(--fg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 20px;
    }

    /* ---------- Main Panel ---------- */
    .panel {
      width: 100%;
      max-width: 860px;
      height: min(92vh, 860px);
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      overflow: hidden;
      box-shadow:
        0 30px 80px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.04);
      backdrop-filter: blur(24px);
    }

    /* ---------- Header ---------- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 38px; height: 38px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #031; font-weight: 800; font-size: 16px;
      box-shadow: 0 0 24px var(--border-glow);
    }
    .brand-text { display: flex; flex-direction: column; }
    .brand-text h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
    .brand-text span { font-size: 11px; color: var(--muted); letter-spacing: 1px; }

    .status { display: flex; align-items: center; gap: 8px; }
    .status-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--danger); box-shadow: 0 0 12px var(--danger);
      transition: all 0.3s;
    }
    .status.online .status-dot { background: var(--accent); box-shadow: 0 0 12px var(--accent); }
    .status-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); }
    .status.online .status-label { color: var(--accent); }

    /* ---------- Chat ---------- */
    .chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }

    .msg { display: flex; gap: 10px; align-items: flex-end; }
    .msg.user { justify-content: flex-end; }
    .msg.assistant { justify-content: flex-start; }

    .avatar {
      width: 30px; height: 30px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
    }
    .msg.assistant .avatar { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #031; }
    .msg.user .avatar { background: var(--bg-tertiary); color: var(--muted); }

    .bubble {
      max-width: 72%; padding: 11px 15px;
      font-size: 13.5px; line-height: 1.45; font-weight: 400;
      word-break: break-word; white-space: pre-wrap;
    }
    .msg.assistant .bubble {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px;
      color: var(--fg);
    }
    .msg.user .bubble {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #02120e;
      border-radius: 16px 4px 16px 16px;
      font-weight: 600;
    }

    .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
    .typing i:nth-child(2) { animation-delay: 0.2s; }
    .typing i:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100% { opacity: 0.3; } 40% { opacity: 1; } }

    /* ---------- Quick Actions ---------- */
    .dock {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.015);
    }
    .dock-title { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
    .dock-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 7px 13px; font-size: 12px; cursor: pointer; font-weight: 500;
      background: var(--bg-tertiary); color: var(--fg);
      border: 1px solid var(--border); border-radius: 999px;
      transition: all 0.18s; font-family: inherit;
    }
    .chip:hover { background: var(--accent); color: #031; border-color: var(--accent); box-shadow: 0 0 16px var(--border-glow); }

    /* ---------- Input Bar ---------- */
    .input-bar {
      display: flex; gap: 10px; align-items: center;
      padding: 16px 24px;
      background: rgba(255,255,255,0.02);
    }
    .input-bar input {
      flex: 1; padding: 12px 16px;
      background: var(--bg-tertiary); color: var(--fg);
      border: 1px solid var(--border); border-radius: 14px;
      font-size: 13.5px; font-family: inherit; outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }
    .input-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--border-glow); }
    .input-bar input::placeholder { color: var(--muted); }

    .icon-btn {
      width: 44px; height: 44px; flex-shrink: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-tertiary); color: var(--fg);
      border: 1px solid var(--border); border-radius: 14px;
      transition: all 0.18s;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 16px var(--border-glow); }
    .icon-btn.active { background: var(--danger); color: #fff; border-color: var(--danger); box-shadow: 0 0 18px rgba(255,77,109,0.4); }

    .send-btn {
      height: 44px; padding: 0 20px; flex-shrink: 0; cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #02120e; border: none; border-radius: 14px;
      font-weight: 700; font-size: 13px; transition: all 0.18s;
    }
    .send-btn:hover { filter: brightness(1.08); box-shadow: 0 0 20px var(--border-glow); }

    .mic-hint { font-size: 10.5px; color: var(--muted); text-align: center; padding: 0 24px 6px; }

    .chat::-webkit-scrollbar { width: 8px; }
    .chat::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 8px; }
    .chat::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    @media (max-width: 560px) {
      body { padding: 10px; }
      .panel { height: 96vh; border-radius: 20px; }
      .bubble { max-width: 82%; }
      .input-bar { padding: 12px; }
      .send-btn { padding: 0 14px; }
      .dock { padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="panel">
    <!-- HEADER -->
    <div class="header">
      <div class="brand">
        <div class="brand-icon">J</div>
        <div class="brand-text">
          <h1>JARVIS</h1>
          <span>PERSONAL AI ASSISTANT</span>
        </div>
      </div>
      <div class="status online" id="status">
        <span class="status-dot"></span>
        <span class="status-label">Ready</span>
      </div>
    </div>

    <!-- CHAT -->
    <div class="chat" id="chat">
      <div class="msg assistant">
        <div class="avatar">J</div>
        <div class="bubble">System online. Welcome back, sir. How may I assist you?</div>
      </div>
    </div>

    <!-- QUICK ACTIONS -->
    <div class="dock">
      <div class="dock-title">Quick Actions</div>
      <div class="dock-chips">
        <button class="chip" data-cmd="open youtube">YouTube</button>
        <button class="chip" data-cmd="open terminal">Terminal</button>
        <button class="chip" data-cmd="open finder">Finder</button>
        <button class="chip" data-cmd="open spotify">Spotify</button>
        <button class="chip" data-cmd="mute">Mute</button>
        <button class="chip" data-cmd="unmute">Unmute</button>
        <button class="chip" data-cmd="system check">System Check</button>
        <button class="chip" data-cmd="screenshot">Screenshot</button>
      </div>
    </div>

    <!-- INPUT BAR -->
    <div class="input-bar">
      <button class="icon-btn" id="mic-btn" title="Voice input (hold/click to speak)" aria-label="Voice input">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
          <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
        </svg>
      </button>
      <input id="cmd-input" type="text" placeholder="Type a command, ask a question, or tap the mic…" autocomplete="off">
      <button class="send-btn" id="send-btn">Send</button>
    </div>
    <div class="mic-hint" id="mic-hint"></div>
  </div>

  <script>
    (function () {
      "use strict";

      // ---------- DOM ----------
      var chat = document.getElementById("chat");
      var cmdInput = document.getElementById("cmd-input");
      var sendBtn = document.getElementById("send-btn");
      var micBtn = document.getElementById("mic-btn");
      var statusBox = document.getElementById("status");
      var micHint = document.getElementById("mic-hint");

      // ---------- Voice (Web Speech API) ----------
      var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      var recognition = SpeechRecognition ? new SpeechRecognition() : null;
      var isListening = false;
      if (recognition) {
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = "en-US";

        recognition.onresult = function (event) {
          var transcript = event.results[0][0].transcript.trim();
          cmdInput.value = transcript;
          sendMsg();
        };

        recognition.onerror = function (event) {
          setListening(false);
          if (event.error === "not-allowed" || event.error === "service-not-allowed") {
            micHint.textContent = "Microphone access blocked — allow it in your browser.";
          } else if (event.error === "no-speech") {
            micHint.textContent = "I didn't catch that. Try again.";
          } else {
            micHint.textContent = "Voice error: " + event.error;
          }
        };

        recognition.onend = function () {
          setListening(false);
          micHint.textContent = "";
        };
      } else {
        micHint.textContent = "Voice input not supported in this browser.";
      }

      function setListening(state) {
        isListening = state;
        if (isListening) {
          micBtn.classList.add("active");
          micHint.textContent = "Listening… speak now.";
        } else {
          micBtn.classList.remove("active");
          micHint.textContent = "";
        }
      }

      micBtn.addEventListener("click", function () {
        if (!recognition) return;
        if (isListening) {
          recognition.stop();
          setListening(false);
        } else {
          try {
            recognition.start();
            setListening(true);
          } catch (e) {
            micHint.textContent = "Voice already active — try once more.";
          }
        }
      });

      // ---------- Message Rendering ----------
      function appendMessage(text, isUser) {
        var msg = document.createElement("div");
        msg.className = "msg " + (isUser ? "user" : "assistant");

        var avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = isUser ? "YOU" : "J";

        var bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        msg.appendChild(avatar);
        msg.appendChild(bubble);
        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
        return bubble;
      }

      function appendTyping() {
        var msg = document.createElement("div");
        msg.className = "msg assistant";
        var avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "J";
        var bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.id = "typing-indicator";
        bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
        msg.appendChild(avatar);
        msg.appendChild(bubble);
        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
      }

      function removeTyping() {
        var t = document.getElementById("typing-indicator");
        if (t) t.parentElement.remove();
      }

      // ---------- API Call ----------
      function sendMsg(muted) {
        var text = cmdInput.value.trim();
        if (!text) return;
        cmdInput.value = "";
        appendMessage(text, true);
        appendTyping();

        fetch("/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command: text })
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            removeTyping();
            var reply = data && data.status === "success"
              ? data.message
              : (data && data.message ? "Error: " + data.message : "Error: Unknown error");
            appendMessage(reply, false);
          })
          .catch(function () {
            removeTyping();
            appendMessage("Error communicating with the server. Is JARVIS running?", false);
          });
      }

      // ---------- Events ----------
      sendBtn.addEventListener("click", function () { sendMsg(); });
      cmdInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { sendMsg(); }
      });

      document.querySelectorAll(".chip").forEach(function (chip) {
        chip.addEventListener("click", function () {
          var text = chip.getAttribute("data-cmd");
          appendMessage(text, true);
          appendTyping();
          fetch("/api/command", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ command: text })
          })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              removeTyping();
              appendMessage(data && data.status === "success" ? data.message : "Error", false);
            })
            .catch(function () {
              removeTyping();
              appendMessage("Error communicating with the server.", false);
            });
        });
      });

      // ---------- Health check ----------
      fetch("/api/ping")
        .then(function (res) { return res.json(); })
        .then(function () {
          statusBox.classList.add("online");
          document.querySelector(".status-label").textContent = "Ready";
        })
        .catch(function () {
          statusBox.classList.remove("online");
          document.querySelector(".status-label").textContent = "Offline";
        });
    })();
  </script>
</body>
</html>
