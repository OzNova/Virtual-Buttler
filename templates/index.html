<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Butler — Command Center</title>
  <style>
    /* ================================================================
       Butler — Apple Human Interface inspired
       Quiet light UI · SF system type · hairlines · one blue accent
       No neon, no glow, no gradients-as-decoration.
       ================================================================ */
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --sidebar: #fbfbfd;
      --text: #1d1d1f;
      --secondary: #6e6e73;
      --tertiary: #86868b;
      --hairline: #d2d2d7;
      --fill: #e8e8ed;
      --blue: #0071e3;
      --blue-hover: #0077ed;
      --blue-pressed: #0068d1;
      --green: #1d8127;
      --red: #d70015;
      --amber: #9a6700;
      --radius: 18px;
      --radius-sm: 12px;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.06);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1d1d1f;
        --sidebar: #101012;
        --text: #f5f5f7;
        --secondary: #a1a1a6;
        --tertiary: #6e6e73;
        --hairline: #38383a;
        --fill: #2d2d2f;
        --blue: #0a84ff;
        --blue-hover: #409cff;
        --blue-pressed: #0060d1;
        --green: #30d158;
        --red: #ff453a;
        --amber: #ffd60a;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px rgba(0, 0, 0, 0.45);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow: hidden;
    }

    /* ── App frame: quiet three-pane layout like Mail/Finder ── */
    .app {
      display: grid;
      grid-template-columns: 272px minmax(0, 1fr) 272px;
      height: 100vh;
      max-width: 1440px;
      margin: 0 auto;
      background: var(--card);
      border-left: 1px solid var(--hairline);
      border-right: 1px solid var(--hairline);
    }

    .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    .side {
      background: var(--sidebar);
      padding: 20px 16px;
      gap: 16px;
      overflow-y: auto;
    }
    .side.left { border-right: 1px solid var(--hairline); }
    .side.right { border-left: 1px solid var(--hairline); }

    /* ── macOS window chrome ── */
    .traffic {
      display: flex; gap: 8px; align-items: center;
      padding: 2px 4px 0;
    }
    .traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }
    .traffic i:nth-child(1) { background: #ff5f57; border: 1px solid rgba(0,0,0,0.08); }
    .traffic i:nth-child(2) { background: #febc2e; border: 1px solid rgba(0,0,0,0.08); }
    .traffic i:nth-child(3) { background: #28c840; border: 1px solid rgba(0,0,0,0.08); }
    @media (prefers-color-scheme: dark) {
      .traffic i { border-color: rgba(255,255,255,0.12); }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    @media (prefers-color-scheme: light) {
      .side .card { box-shadow: none; }
    }

    .card-title {
      font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--secondary);
      margin-bottom: 12px;
    }

    /* ── Status pills: small, flat, legible ── */
    .status-stack { display: flex; flex-wrap: wrap; gap: 8px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
      background: var(--fill); color: var(--secondary);
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--tertiary); flex-shrink: 0; }
    .badge.online { background: rgba(29, 129, 39, 0.1); color: var(--green); }
    .badge.online .dot { background: var(--green); }
    @media (prefers-color-scheme: dark) {
      .badge.online { background: rgba(48, 209, 88, 0.14); }
    }
    .badge.gemini.ready { background: rgba(0, 113, 227, 0.1); color: var(--blue); }
    .badge.gemini.ready .dot { background: var(--blue); }

    /* ── Clock: SF, tabular, no gradient ── */
    .clock-wrap { margin-top: 14px; }
    .clock {
      font-size: 34px; font-weight: 600; letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums; line-height: 1.1;
    }
    .date-txt { margin-top: 2px; font-size: 13px; color: var(--secondary); }

    /* ── Performance: thin solid rings, no glow ── */
    .rings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .ring { position: relative; display: flex; align-items: center; justify-content: center; min-height: 104px; }
    .ring svg { width: 88px; height: 88px; transform: rotate(-90deg); }
    .ring .track { fill: none; stroke: var(--fill); stroke-width: 8; stroke-linecap: round; }
    .ring .prog {
      fill: none; stroke-width: 8; stroke-linecap: round;
      stroke-dasharray: 263.9; stroke-dashoffset: 263.9;
      transition: stroke-dashoffset 0.6s ease;
    }
    .ring .prog.cpu { stroke: var(--blue); }
    .ring .prog.ram { stroke: var(--secondary); }
    .ring-label { position: absolute; text-align: center; }
    .ring-label strong { display: block; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
    .ring-label span { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--secondary); text-transform: uppercase; }
    .mem-detail { margin-top: 10px; display: flex; justify-content: space-between; font-size: 12px; color: var(--secondary); font-variant-numeric: tabular-nums; }

    .batt-wrap { display: flex; align-items: center; gap: 10px; }
    .battery { flex: 1; height: 8px; border-radius: 999px; overflow: hidden; background: var(--fill); }
    .battery-fill { height: 100%; width: 0%; border-radius: 999px; background: var(--text); transition: width 0.6s ease; }
    .battery-fill.low { background: var(--red); }
    .batt-pct { font-family: var(--mono); font-size: 13px; font-weight: 500; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
    .batt-state { margin-top: 8px; font-size: 12px; color: var(--secondary); }

    /* ── Center: toolbar + chat ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--hairline);
      background: var(--card);
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-icon {
      width: 32px; height: 32px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      background: var(--text); color: var(--card);
      font-weight: 600; font-size: 15px; flex-shrink: 0;
    }
    .brand-text h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
    .brand-text span { font-size: 12px; color: var(--secondary); }
    .topbar .statuses { display: flex; gap: 8px; align-items: center; }

    .chat {
      flex: 1; min-height: 0; overflow-y: auto;
      padding: 20px; display: flex; flex-direction: column; gap: 12px;
      background: var(--card);
    }

    .msg { display: flex; align-items: flex-end; gap: 8px; }
    .msg.user { justify-content: flex-end; }

    .jarvis-badge {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600;
      background: var(--fill); color: var(--secondary);
    }
    .bubble {
      max-width: 72%; padding: 10px 14px;
      font-size: 15px; line-height: 1.5; letter-spacing: -0.005em;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.assistant .bubble {
      background: var(--fill);
      color: var(--text);
      border-radius: 18px 18px 18px 6px;
    }
    @media (prefers-color-scheme: light) {
      .msg.assistant .bubble { background: #f5f5f7; }
    }
    .msg.user { flex-direction: column; align-items: flex-end; }
    .msg.user .user-tag {
      font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
      color: var(--secondary); text-transform: uppercase;
    }
    .msg.user .bubble {
      background: var(--blue); color: #fff;
      border-radius: 18px 18px 6px 18px;
    }

    .typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--secondary); opacity: 0.5; }
    .typing i:nth-child(2) { opacity: 0.7; }
    .typing i:nth-child(3) { opacity: 1; }

    /* ── Voice status: one quiet line, no orb ── */
    .voice-zone {
      flex-shrink: 0; padding: 8px 20px 0;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      min-height: 34px;
      background: var(--card);
    }
    .wave { display: flex; align-items: center; gap: 3px; height: 20px; }
    .wave i { width: 3px; height: 4px; border-radius: 2px; background: var(--tertiary); opacity: 0.5; }
    .voice-zone.listening .wave i { background: var(--blue); opacity: 1; }
    .voice-zone.listening .wave i:nth-child(3n) { height: 14px; }
    .voice-zone.listening .wave i:nth-child(3n+1) { height: 18px; }
    .voice-zone.listening .wave i:nth-child(3n+2) { height: 8px; }
    .voice-label { font-size: 11px; font-weight: 500; letter-spacing: 0.04em; color: var(--secondary); text-transform: uppercase; }
    .voice-zone.listening .voice-label { color: var(--blue); }

    /* ── Input: Apple search-field treatment ── */
    .input-wrap { flex-shrink: 0; padding: 10px 20px 16px; background: var(--card); }
    .input-pill {
      display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 8px;
      background: var(--bg); border: 1px solid var(--hairline);
      border-radius: 14px;
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .input-pill:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
      background: var(--card);
    }
    @media (prefers-color-scheme: dark) {
      .input-pill:focus-within { box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.25); }
    }
    .input-pill input {
      flex: 1; min-width: 0; padding: 10px 6px;
      background: transparent; border: none; outline: none;
      color: var(--text); font-size: 15px; font-family: inherit;
    }
    .input-pill input::placeholder { color: var(--tertiary); }
    .icon-btn {
      width: 34px; height: 34px; flex-shrink: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      background: transparent; color: var(--secondary);
      border: none; border-radius: 9px;
    }
    .icon-btn:hover { background: var(--fill); color: var(--text); }
    .icon-btn.active { background: var(--blue); color: #fff; }
    .icon-btn:focus-visible, .send-btn:focus-visible, .chip:focus-visible {
      outline: 2px solid var(--blue); outline-offset: 2px;
    }
    .send-btn {
      height: 34px; padding: 0 18px; flex-shrink: 0; cursor: pointer;
      background: var(--blue); color: #fff; border: none; border-radius: 10px;
      font-family: inherit; font-weight: 600; font-size: 14px;
    }
    .send-btn:hover { background: var(--blue-hover); }
    .send-btn:active { background: var(--blue-pressed); transform: scale(0.98); }

    /* ── Right: quiet grouped actions ── */
    .dock-cat { margin-bottom: 4px; }
    .dock-cat + .dock-cat { margin-top: 18px; }
    .dock-cat-label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--secondary); margin-bottom: 8px; padding: 0 4px;
    }
    .dock-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .dock-grid .chip.wide { grid-column: 1 / -1; }
    .chip {
      padding: 10px 12px; font-size: 13px; font-weight: 500; cursor: pointer;
      text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      font-family: inherit; color: var(--text);
      background: var(--card); border: 1px solid var(--hairline);
      border-radius: 10px;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .chip:hover { background: var(--fill); }
    .chip:active { transform: scale(0.98); }
    .chip.muted { color: var(--amber); border-color: currentColor; }

    .side::-webkit-scrollbar, .chat::-webkit-scrollbar { width: 8px; }
    .side::-webkit-scrollbar-thumb, .chat::-webkit-scrollbar-thumb {
      background: rgba(120, 120, 128, 0.32); border-radius: 8px;
      border: 2px solid transparent; background-clip: content-box;
    }

    @media (max-width: 1100px) {
      .app { grid-template-columns: 248px minmax(0, 1fr); }
      .col.right { display: none; }
    }
    @media (max-width: 760px) {
      body { overflow: auto; }
      .app { grid-template-columns: 1fr; height: auto; min-height: 100vh; border: none; }
      .side.left { order: 2; border-right: none; border-top: 1px solid var(--hairline); }
      .col.center { order: 1; min-height: 72vh; }
      .bubble { max-width: 86%; }
      .topbar { position: sticky; top: 0; z-index: 2; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- LEFT: STATUS -->
    <aside class="col side left" aria-label="System status">
      <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
      <section class="card" aria-label="System status">
        <div class="card-title">System Status</div>
        <div class="status-stack">
          <span class="badge online"><span class="dot"></span>Online</span>
          <span class="badge gemini" id="gemini-badge"><span class="dot"></span>Gemini Standby</span>
        </div>
        <div class="clock-wrap">
          <div class="clock" id="clock">--:--</div>
          <div class="date-txt" id="date">—</div>
        </div>
      </section>

      <section class="card" aria-label="Performance">
        <div class="card-title">Performance</div>
        <div class="rings">
          <div class="ring">
            <svg viewBox="0 0 100 100" role="img" aria-label="CPU usage">
              <circle class="track" cx="50" cy="50" r="42"/>
              <circle class="prog cpu" id="cpu-prog" cx="50" cy="50" r="42"/>
            </svg>
            <div class="ring-label"><strong id="cpu-val">0%</strong><span>CPU</span></div>
          </div>
          <div class="ring">
            <svg viewBox="0 0 100 100" role="img" aria-label="Memory usage">
              <circle class="track" cx="50" cy="50" r="42"/>
              <circle class="prog ram" id="ram-prog" cx="50" cy="50" r="42"/>
            </svg>
            <div class="ring-label"><strong id="ram-val">0%</strong><span>RAM</span></div>
          </div>
        </div>
        <div class="mem-detail" id="mem-detail">Used — GB / — GB</div>
      </section>

      <section class="card" aria-label="Battery">
        <div class="card-title">Battery</div>
        <div class="batt-wrap">
          <div class="battery" role="progressbar" aria-label="Battery level"><div class="battery-fill" id="batt-fill"></div></div>
          <div class="batt-pct" id="batt-pct">N/A</div>
        </div>
        <div class="batt-state" id="batt-state">Not detected</div>
      </section>
    </aside>

    <!-- CENTER: CONVERSATION -->
    <main class="col center">
      <header class="topbar">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">B</div>
          <div class="brand-text">
            <h1>Butler</h1>
            <span>Command Center</span>
          </div>
        </div>
        <div class="statuses">
          <span class="badge online"><span class="dot"></span>Online</span>
          <span class="badge gemini" id="gemini-badge-top"><span class="dot"></span>Gemini Standby</span>
        </div>
      </header>

      <div class="chat" id="chat" aria-live="polite"></div>

      <div class="voice-zone" id="voice-zone">
        <div class="wave" id="wave" aria-hidden="true"></div>
        <div class="voice-label" id="voice-label">Standby</div>
      </div>

      <div class="input-wrap">
        <div class="input-pill">
          <button class="icon-btn" id="mic-btn" title="Voice input" aria-label="Voice input">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
              <path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/>
            </svg>
          </button>
          <input id="cmd-input" type="text" placeholder="Ask Butler to do something…" autocomplete="off" aria-label="Command input">
          <button class="send-btn" id="send-btn">Send</button>
        </div>
        <div class="voice-label" id="mic-hint" style="margin-top:6px"></div>
      </div>
    </main>

    <!-- RIGHT: ACTIONS -->
    <aside class="col side right" aria-label="Quick actions">
      <div class="dock-cat">
        <div class="dock-cat-label">System</div>
        <div class="dock-grid">
          <button class="chip" data-cmd="take screenshot">Screenshot</button>
          <button class="chip" data-cmd="empty trash">Empty Trash</button>
          <button class="chip wide" data-cmd="system check">System Check</button>
          <button class="chip wide" data-action="clear">Clear Conversation</button>
        </div>
      </div>

      <div class="dock-cat">
        <div class="dock-cat-label">Media &amp; Voice</div>
        <div class="dock-grid">
          <button class="chip media" data-media="playpause">Play / Pause</button>
          <button class="chip media" data-media="next">Next Track</button>
          <button class="chip wide mute-toggle" id="voice-mute-btn" data-action="voice">Mute Voice</button>
        </div>
      </div>

      <div class="dock-cat">
        <div class="dock-cat-label">Places</div>
        <div class="dock-grid">
          <button class="chip" data-cmd="what time is it">Time</button>
          <button class="chip" data-cmd="world news">News</button>
          <button class="chip" data-cmd="open spotify">Spotify</button>
          <button class="chip" data-cmd="open youtube">YouTube</button>
          <button class="chip wide" data-cmd="open chrome">Open Chrome</button>
        </div>
      </div>

      <div class="dock-cat">
        <div class="dock-cat-label">Money</div>
        <div class="dock-grid">
          <button class="chip" data-cmd="bitcoin price">Bitcoin</button>
          <button class="chip" data-cmd="dollar rate">Dollar</button>
          <button class="chip" data-cmd="euro rate">Euro</button>
          <button class="chip wide" data-cmd="dolar kaç tl">USD to TRY</button>
        </div>
      </div>
    </aside>
  </div>

  <script>
    (function () {
      "use strict";

      var chat = document.getElementById("chat");
      var input = document.getElementById("cmd-input");
      var sendBtn = document.getElementById("send-btn");
      var micBtn = document.getElementById("mic-btn");
      var micHint = document.getElementById("mic-hint");
      var voiceZone = document.getElementById("voice-zone");
      var voiceLabel = document.getElementById("voice-label");

      var wave = document.getElementById("wave");
      for (var i = 0; i < 26; i++) {
        var bar = document.createElement("i");
        wave.appendChild(bar);
      }

      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      var recognition = SR ? new SR() : null;
      var isListening = false;

      function setListening(state) {
        isListening = state;
        micBtn.classList.toggle("active", state);
        micHint.textContent = state ? "Listening… speak now." : "";
        voiceLabel.textContent = state ? "Listening" : "Standby";
        voiceZone.classList.toggle("listening", state);
      }

      if (recognition) {
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = "en-US";
        recognition.onresult = function (event) {
          var transcript = event.results[0][0].transcript.trim();
          if (transcript) sendCommand(transcript);
        };
        recognition.onerror = function (event) {
          setListening(false);
          micHint.textContent =
            event.error === "not-allowed" ? "Microphone access blocked." :
            event.error === "no-speech"   ? "No speech detected. Try again." :
            "Voice error: " + event.error;
        };
        recognition.onend = function () { setListening(false); };
      } else {
        micHint.textContent = "Voice input not supported in this browser.";
      }

      micBtn.addEventListener("click", function () {
        if (!recognition) return;
        if (isListening) { recognition.stop(); setListening(false); }
        else {
          try { recognition.start(); setListening(true); }
          catch (e) { micHint.textContent = "Voice already active — try once more."; }
        }
      });

      function scrollToBottom() {
        chat.scrollTo({ top: chat.scrollHeight, behavior: "smooth" });
      }

      function appendAssistant(text) {
        var msg = document.createElement("div");
        msg.className = "msg assistant";
        var badge = document.createElement("div");
        badge.className = "jarvis-badge";
        badge.textContent = "B";
        var bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        msg.appendChild(badge);
        msg.appendChild(bubble);
        chat.appendChild(msg);
        scrollToBottom();
      }

      function appendUser(text) {
        var msg = document.createElement("div");
        msg.className = "msg user";
        var tag = document.createElement("span");
        tag.className = "user-tag";
        tag.textContent = "You";
        var bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        msg.appendChild(tag);
        msg.appendChild(bubble);
        chat.appendChild(msg);
        scrollToBottom();
      }

      function appendTyping() {
        var msg = document.createElement("div");
        msg.className = "msg assistant";
        msg.id = "typing-msg";
        msg.innerHTML =
          '<div class="jarvis-badge">B</div>' +
          '<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
        chat.appendChild(msg);
        scrollToBottom();
      }

      function removeTyping() {
        var t = document.getElementById("typing-msg");
        if (t) t.remove();
      }

      var speakTimer = null;

      function pulseVoice(seconds) {
        voiceZone.classList.add("listening");
        voiceLabel.textContent = "Speaking";
        if (speakTimer) clearTimeout(speakTimer);
        speakTimer = setTimeout(function () {
          voiceZone.classList.remove("listening");
          voiceLabel.textContent = "Standby";
        }, seconds * 1000);
      }

      function sendCommand(text) {
        var value = (text || "").trim();
        if (!value) return;
        input.value = "";
        appendUser(value);
        appendTyping();

        fetch("/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command: value })
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            removeTyping();
            var reply = (data && data.status === "success")
              ? data.message
              : (data && data.message ? "Error: " + data.message : "Error: Unknown response");
            appendAssistant(reply);
            var words = reply.split(/\s+/).length;
            pulseVoice(Math.max(1.4, Math.min(14, words / 2.7)));
          })
          .catch(function () {
            removeTyping();
            appendAssistant("Error communicating with the server. Is Butler running?");
          });
      }

      document.querySelectorAll("[data-media]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          fetch("/api/media", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: btn.getAttribute("data-media") })
          })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              appendAssistant(data.message || "Command sent.");
            })
            .catch(function () { appendAssistant("Could not reach media controls."); });
        });
      });

      var voiceMuteBtn = document.getElementById("voice-mute-btn");

      function refreshMute(muted) {
        voiceMuteBtn.classList.toggle("muted", muted);
        voiceMuteBtn.textContent = muted ? "Unmute Voice" : "Mute Voice";
        voiceMuteBtn.setAttribute("data-muted", muted ? "1" : "0");
      }

      function initMute() {
        fetch("/api/voice-mute")
          .then(function (r) { return r.json(); })
          .then(function (d) { refreshMute(!!d.muted); })
          .catch(function () {});
      }

      voiceMuteBtn.addEventListener("click", function () {
        fetch("/api/voice-mute", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({})
        })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            refreshMute(!!d.muted);
            var words = (voiceMuteBtn.getAttribute("data-muted") === "1")
              ? "Voice output muted, sir." : "Voice output enabled, sir.";
            appendAssistant(words);
          })
          .catch(function () {});
      });

      var RING_C = 2 * Math.PI * 42;
      var cpuProg = document.getElementById("cpu-prog");
      var ramProg = document.getElementById("ram-prog");
      var cpuVal = document.getElementById("cpu-val");
      var ramVal = document.getElementById("ram-val");
      var memDetail = document.getElementById("mem-detail");
      var battFill = document.getElementById("batt-fill");
      var battPct = document.getElementById("batt-pct");
      var battState = document.getElementById("batt-state");
      var clockEl = document.getElementById("clock");
      var dateEl = document.getElementById("date");

      cpuProg.style.strokeDasharray = RING_C;
      ramProg.style.strokeDasharray = RING_C;

      function setRing(el, pct) {
        var clamped = Math.max(0, Math.min(100, pct || 0));
        el.style.strokeDashoffset = RING_C * (1 - clamped / 100);
      }

      function setGeminiBadges(ready) {
        ["gemini-badge", "gemini-badge-top"].forEach(function (id) {
          var b = document.getElementById(id);
          if (!b) return;
          b.classList.toggle("ready", !!ready);
          b.lastChild.textContent = ready ? "Gemini Ready" : "Gemini Standby";
        });
      }

      function renderClock() {
        var now = new Date();
        var h = now.getHours() % 12 || 12;
        var m = String(now.getMinutes()).padStart(2, "0");
        clockEl.textContent = h + ":" + m;
        var opts = { weekday: "long", month: "long", day: "numeric" };
        dateEl.textContent = now.toLocaleDateString(undefined, opts);
      }

      function fetchWithTimeout(url, opts, ms) {
        opts = opts || {};
        ms = ms || 8000;
        var ctrl = new AbortController();
        var id = setTimeout(function () { ctrl.abort(); }, ms);
        opts.signal = ctrl.signal;
        return fetch(url, opts).finally(function () { clearTimeout(id); });
      }

      function fetchTelemetry() {
        fetchWithTimeout("/api/telemetry", {}, 5000)
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (d.status !== "success" || !d.telemetry) return;
            var t = d.telemetry;
            setRing(cpuProg, t.cpu);
            setRing(ramProg, t.ram_percent);
            cpuVal.textContent = (t.cpu || 0) + "%";
            ramVal.textContent = (t.ram_percent || 0) + "%";
            memDetail.textContent = "Used " + (t.ram_used_gb || 0) + " GB / " + (t.ram_total_gb || 0) + " GB";
            if (t.battery_percent != null) {
              battFill.style.width = t.battery_percent + "%";
              battPct.textContent = t.battery_percent + "%";
              battFill.classList.toggle("low", t.battery_percent < 25);
              battState.textContent = t.battery_charging ? "Charging" : "On battery";
            }
            setGeminiBadges(t.gemini_ready);
          })
          .catch(function () {});
      }

      setInterval(fetchTelemetry, 2500);
      setInterval(renderClock, 1000);
      initMute();

      sendBtn.addEventListener("click", function () { sendCommand(input.value); });
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") sendCommand(input.value);
      });

      document.querySelectorAll(".chip").forEach(function (chip) {
        chip.addEventListener("click", function () {
          var action = chip.getAttribute("data-action");
          if (action === "clear") {
            chat.innerHTML = "";
            appendAssistant("Conversation cleared.");
            return;
          }
          if (action === "voice") return;
          sendCommand(chip.getAttribute("data-cmd"));
        });
      });

      fetch("/api/ping")
        .then(function (res) { return res.json(); })
        .then(function () {
          document.querySelectorAll(".badge.online").forEach(function (b) {
            b.classList.add("online");
          });
        })
        .catch(function () {});

      renderClock();
      fetchTelemetry();
      appendAssistant("Butler is ready. How can I help?");
    })();
  </script>
</body>
</html>
