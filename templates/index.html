<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AI</title>
  <style>
    :root {
      --bg: #05060a;
      --bg-secondary: #0d0f17;
      --bg-tertiary: #161a26;
      --fg: #e8eaf3;
      --muted: #6b7288;
      --accent: #00ffcc;
      --accent-2: #7aa2ff;
      --border: rgba(255,255,255,0.08);
      --border-glow: rgba(0,255,204,0.25);
      --danger: #ff4d6d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(0,255,204,0.10), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(122,162,255,0.08), transparent 60%),
        var(--bg);
      color: var(--fg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 20px;
    }

    /* ────────────── Main panel ────────────── */
    .panel {
      width: 100%;
      max-width: 860px;
      height: min(92vh, 860px);
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 20% 0%, #111423, #0b0d16 70%);
      border: 1px solid var(--border);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    }

    /* ────────────── Header ────────────── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 38px; height: 38px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #031; font-weight: 800; font-size: 16px;
      box-shadow: 0 0 24px var(--border-glow);
    }
    .brand-text { display: flex; flex-direction: column; }
    .brand-text h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
    .brand-text span { font-size: 11px; color: var(--muted); letter-spacing: 1px; }

    .status { display: flex; align-items: center; gap: 8px; }
    .status-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 12px var(--danger);
      transition: all 0.3s;
    }
    .status-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); }
    .online .status-dot { background: var(--accent); box-shadow: 0 0 12px var(--accent); }
    .online .status-label { color: var(--accent); }

    /* ────────────── Chat area ────────────── */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .chat::-webkit-scrollbar { width: 8px; }
    .chat::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 8px; }

    .msg { display: flex; gap: 10px; align-items: flex-end; }
    .msg.user { justify-content: flex-end; }
    .msg.assistant { justify-content: flex-start; }

    .avatar {
      width: 30px; height: 30px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
    }
    .msg.assistant .avatar { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #031; }
    .msg.user .avatar { background: var(--bg-tertiary); color: var(--muted); }

    .bubble {
      max-width: 72%;
      padding: 11px 15px;
      font-size: 13.5px;
      line-height: 1.45;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg.assistant .bubble {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px;
    }
    .msg.user .bubble {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #02120e;
      border-radius: 16px 4px 16px 16px;
      font-weight: 600;
    }

    .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
    .typing i:nth-child(2) { animation-delay: 0.2s; }
    .typing i:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100% { opacity: 0.3; } 40% { opacity: 1; } }

    /* ────────────── Quick actions (horizontal row) ────────────── */
    .dock {
      padding: 12px 24px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.015);
    }
    .dock-chips {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .dock-chips::-webkit-scrollbar { height: 4px; }
    .dock-chips::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 4px; }
    .chip {
      flex-shrink: 0;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      background: var(--bg-tertiary);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: all 0.18s;
      font-family: inherit;
      white-space: nowrap;
    }
    .chip:hover {
      background: var(--accent);
      color: #031;
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--border-glow);
    }

    /* ────────────── Input bar ────────────── */
    .input-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 16px 24px;
      background: rgba(255,255,255,0.02);
    }
    .input-bar input {
      flex: 1;
      padding: 12px 16px;
      background: var(--bg-tertiary);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }
    .input-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--border-glow); }
    .input-bar input::placeholder { color: var(--muted); }

    .send-btn {
      height: 44px;
      padding: 0 22px;
      flex-shrink: 0;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #02120e;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 13px;
      font-family: inherit;
      transition: all 0.18s;
    }
    .send-btn:hover { filter: brightness(1.08); box-shadow: 0 0 20px var(--border-glow); }

    /* ────────────── Mic button ────────────── */
    .icon-btn {
      width: 44px; height: 44px; flex-shrink: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-tertiary); color: var(--fg);
      border: 1px solid var(--border); border-radius: 14px;
      transition: all 0.18s;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 16px var(--border-glow); }
    .icon-btn.active { background: var(--danger); color: #fff; border-color: var(--danger); box-shadow: 0 0 18px rgba(255,77,109,0.4); }
    .mic-hint { font-size: 10.5px; color: var(--muted); text-align: center; padding: 0 24px 6px; }

    @media (max-width: 560px) {
      body { padding: 10px; }
      .panel { height: 96vh; border-radius: 20px; }
      .bubble { max-width: 82%; }
      .input-bar { padding: 12px; }
      .dock { padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <div class="panel">
    <!-- HEADER -->
    <div class="header">
      <div class="brand">
        <div class="brand-icon">J</div>
        <div class="brand-text">
          <h1>JARVIS</h1>
          <span>PERSONAL AI ASSISTANT</span>
        </div>
      </div>
      <div class="status" id="status">
        <span class="status-dot"></span>
        <span class="status-label">Connecting…</span>
      </div>
    </div>

    <!-- CHAT (messages injected by JS; no static dummy bubble) -->
    <div class="chat" id="chat"></div>

    <!-- QUICK ACTIONS: horizontal row above the input bar -->
    <div class="dock">
      <div class="dock-chips" id="dock-chips">
        <button class="chip" data-cmd="open youtube">YouTube</button>
        <button class="chip" data-cmd="open terminal">Terminal</button>
        <button class="chip" data-cmd="open finder">Finder</button>
        <button class="chip" data-cmd="open spotify">Spotify</button>
        <button class="chip" data-cmd="mute">Mute</button>
        <button class="chip" data-cmd="unmute">Unmute</button>
        <button class="chip" data-cmd="system check">System Check</button>
        <button class="chip" data-cmd="screenshot">Screenshot</button>
      </div>
    </div>

    <!-- INPUT BAR -->
    <div class="input-bar">
      <button class="icon-btn" id="mic-btn" title="Voice input" aria-label="Voice input">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
          <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
        </svg>
      </button>
      <input id="cmd-input" type="text" placeholder="Type a command or ask JARVIS…" autocomplete="off">
      <button class="send-btn" id="send-btn">Send</button>
    </div>
    <div class="mic-hint" id="mic-hint"></div>
  </div>

  <script>
    (function () {
      "use strict";

      // ---------- DOM ----------
      var chat    = document.getElementById("chat");
      var input   = document.getElementById("cmd-input");
      var sendBtn = document.getElementById("send-btn");
      var micBtn  = document.getElementById("mic-btn");
      var micHint = document.getElementById("mic-hint");
      var status  = document.getElementById("status");

      // ---------- Voice input (Web Speech API) ----------
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      var recognition = SR ? new SR() : null;
      var isListening = false;

      function setListening(state) {
        isListening = state;
        micBtn.classList.toggle("active", state);
        micHint.textContent = state ? "Listening… speak now." : "";
      }

      if (recognition) {
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = "en-US";

        recognition.onresult = function (event) {
          var transcript = event.results[0][0].transcript.trim();
          if (transcript) {
            input.value = transcript;
            sendCommand(transcript);
          }
        };
        recognition.onerror = function (event) {
          setListening(false);
          micHint.textContent =
            event.error === "not-allowed" ? "Microphone access blocked." :
            event.error === "no-speech"   ? "No speech detected. Try again." :
            "Voice error: " + event.error;
        };
        recognition.onend = function () { setListening(false); };
      } else {
        micHint.textContent = "Voice input not supported in this browser.";
      }

      micBtn.addEventListener("click", function () {
        if (!recognition) return;
        if (isListening) { recognition.stop(); setListening(false); }
        else {
          try { recognition.start(); setListening(true); }
          catch (e) { micHint.textContent = "Voice already active — try once more."; }
        }
      });

      // ---------- Rendering ----------
      function appendMessage(text, isUser) {
        var msg = document.createElement("div");
        msg.className = "msg " + (isUser ? "user" : "assistant");

        var avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = isUser ? "YOU" : "J";

        var bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        msg.appendChild(avatar);
        msg.appendChild(bubble);
        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
      }

      function appendTyping() {
        var msg = document.createElement("div");
        msg.className = "msg assistant";
        msg.id = "typing-msg";
        msg.innerHTML =
          '<div class="avatar">J</div>' +
          '<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
      }

      function removeTyping() {
        var t = document.getElementById("typing-msg");
        if (t) t.remove();
      }

      // ---------- API (POST JSON to /api/command) ----------
      function sendCommand(text) {
        var value = (text || "").trim();
        if (!value) return;
        input.value = "";
        appendMessage(value, true);
        appendTyping();

        fetch("/api/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ command: value })
        })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            removeTyping();
            var reply = (data && data.status === "success")
              ? data.message
              : (data && data.message ? "Error: " + data.message : "Error: Unknown response");
            appendMessage(reply, false);
          })
          .catch(function () {
            removeTyping();
            appendMessage("Error communicating with the server. Is JARVIS running?", false);
          });
      }

      // ---------- Events ----------
      sendBtn.addEventListener("click", function () { sendCommand(input.value); });
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") sendCommand(input.value);
      });

      document.querySelectorAll(".chip").forEach(function (chip) {
        chip.addEventListener("click", function () {
          sendCommand(chip.getAttribute("data-cmd"));
        });
      });

      // ---------- Health check + welcome ----------
      fetch("/api/ping")
        .then(function (res) { return res.json(); })
        .then(function () {
          status.classList.add("online");
          document.querySelector(".status-label").textContent = "Ready";
        })
        .catch(function () {
          status.classList.remove("online");
          document.querySelector(".status-label").textContent = "Offline";
        });

      appendMessage("System online. Welcome back, sir. How may I assist you?", false);
    })();
  </script>
</body>
</html>
