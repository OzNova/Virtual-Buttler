<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS SYSTEM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ---------- Design System: Modern Dark / Glassmorphism ---------- */
    :root {
      --bg: #0b0c10;
      --bg-secondary: #12131a;
      --bg-tertiary: #1a1c24;
      --fg: #e8eaed;
      --muted: #5a5c67;
      --accent: #66fcf1;
      --accent-dim: rgba(102, 252, 241, 0.08);
      --card: #161a22;
      --border: rgba(102, 252, 241, 0.12);
      --glow-connected: rgba(102, 252, 241, 0.4);
      --glow-disconnected: rgba(255, 55, 55, 0.3);
      --error: #ff3e3e;
      --success: #66fcf1;
    }

    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    html { height: 100%; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100%;
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

    /* ---------- Page Background & Glass Panel ---------- */
    .page-bg {
      position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 100% 60% at 20% 20%, rgba(102, 252, 241, 0.05), transparent 50%),
        radial-gradient(ellipse 80% 50% at 80% 80%, rgba(189, 19, 254, 0.04), transparent 50%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-secondary) 100%);
      z-index: -1;
    }

    .glass-panel {
      position: relative; z-index: 1;
      max-width: 900px; margin: 0 auto; padding: 32px 24px;
      height: 90vh; backdrop-filter: blur(20px); border-radius: 24px;
      border: 1px solid var(--border); background: var(--card);
      overflow: hidden; display: flex; flex-direction: column;
    }

    /* ---------- Header ---------- */
    .header {
      display: flex; justify-content: space-between; align-items: center; padding: 12px 20px;
      background: var(--bg-secondary); border-radius: 16px 16px 0 0; border-bottom: 1px solid var(--border);
    }

    .header-title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600; letter-spacing: -0.5px; }
    .badge {
      padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5em;
      transition: all 0.25s; border: 1px solid var(--border);
    }
    .badge.connected {
      background: rgba(102, 252, 241, 0.12); color: var(--accent);
      border-color: var(--accent); box-shadow: 0 0 20px var(--glow-connected);
    }
    .badge.disconnected {
      background: rgba(255, 55, 55, 0.12); color: var(--error);
      border-color: var(--error); box-shadow: 0 0 20px var(--glow-disconnected);
    }

    /* ---------- Chat Container ---------- */
    .chat-container { flex: 1; overflow-y: auto; padding: 24px 20px 20px; }

    .msg {
      display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; font-size: 14px; word-break: break-word;
    }
    .msg.user { justify-content: flex-end; }
    .msg.assistant { justify-content: flex-start; }

    .msg-avatar {
      width: 30px; height: 30px; border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
    }
    .msg-avatar.user { background: var(--accent); color: var(--bg); }
    .msg-avatar.assistant { background: var(--card); color: var(--muted); }

    .msg-bubble {
      max-width: 75%; padding: 12px 16px; border-radius: 18px 12px 12px 18px;
      font-size: 13px; line-height: 1.4; word-break: break-word; font-weight: 500;
    }
    .msg-bubble.user { background: var(--accent); color: var(--bg); margin-left: auto; }
    .msg-bubble.assistant { background: rgba(255, 255, 255, 0.04); color: var(--fg); border: 1px solid var(--border); border-radius: 12px 18px 18px 12px; }

    .msg-meta { font-size: 10px; color: var(--muted); margin-top: 4px; }

    /* ---------- Quick Actions Dock ---------- */
    .actions-dock {
      padding: 20px 24px; background: var(--bg-secondary); border-radius: 0 0 24px 24px; border-top: 1px solid var(--border);
    }
    .actions-dock .title { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 12px; }
    .actions-dock .btn {
      padding: 8px 14px; border: none; border-radius: 10px; cursor: pointer;
      font-family: inherit; font-size: 12px; font-weight: 500; transition: background 0.15s;
      background: var(--bg-tertiary); color: var(--fg);
    }
    .actions-dock .btn:hover { background: var(--accent); color: var(--bg); }
    .actions-dock .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- Input Bar ---------- */
    .input-bar { padding: 16px 20px; background: var(--bg-secondary); border-radius: 20px; border: 1px solid var(--border); }
    .input-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 24px var(--glow-connected); }
    .input-bar input { flex: 1; padding: 10px 14px; background: var(--bg-tertiary); border: none; border-radius: 14px; color: var(--fg); font-size: 13px; font-family: var(--mono); resize: none; outline: none; }
    .input-bar input:focus { background: var(--bg-tertiary); }
    .input-bar input::placeholder { color: var(--muted); }
    .input-bar .btn { padding: 0 20px; background: var(--accent); color: var(--bg); border: none; border-radius: 14px; font-weight: 600; font-size: 13px; cursor: pointer; min-width: 72px; }

    @media (max-width: 600px) {
      .glass-panel { padding: 16px; height: auto; }
      .header { padding: 10px 16px; border-radius: 12px 12px 0 0; }
      .actions-dock { padding: 12px 16px; border-radius: 0 0 16px 16px; }
      .actions-dock .btn { padding: 6px 10px; font-size: 11px; }
      .input-bar { padding: 10px 12px; }
      .input-bar input { font-size: 12px; }
      .input-bar .btn { min-width: 50px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="page-bg"></div>

  <div class="glass-panel">
    <!-- ========= HEADER ========= -->
    <header class="header">
      <span class="header-title">JARVIS SYSTEM</span>
      <span class="badge disconnected" id="status-badge">DISCONNECTED</span>
    </header>

    <!-- ========= CHAT CONTAINER ========= -->
    <div class="chat-container" id="chat-messages">
      <!-- Messages injected by JS -->
    </div>

    <!-- ========= QUICK ACTIONS DOCK ========= -->
    <div class="actions-dock">
      <span class="title">Quick Actions</span>
      <div class="btn" onclick="sendQuickCommand('open youtube')">YouTube</div>
      <div class="btn" onclick="sendQuickCommand('open terminal')">Terminal</div>
      <div class="btn" onclick="sendQuickCommand('open finder')">Finder</div>
      <div class="btn" onclick="sendQuickCommand('mute')">Mute</div>
      <div class="btn" onclick="sendQuickCommand('unmute')">Unmute</div>
      <div class="btn" onclick="sendQuickCommand('system check')">System Check</div>
    </div>
  </div>

  <!-- Input Bar (fixed position at bottom) -->
  <div class="input-bar" id="input-bar">
    <input id="cmd-input" type="text" placeholder="Type a command…" autocomplete="off">
    <button class="btn" onclick="sendMsg()">Send</button>
  </div>

  <!-- Socket.IO CDN -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    /* ---------- Socket.IO Connection ---------- */
    const socket = io("http://127.0.0.1:5000", {
      transports: ["websocket", "polling"],
      reconnectionAttempts: 5,
      reconnectionDelay: 2000
    });

    /* ---------- DOM Elements ---------- */
    const statusBadge = document.getElementById("status-badge");
    const chatMessages = document.getElementById("chat-messages");
    const cmdInput = document.getElementById("cmd-input");

    /* ---------- State ---------- */
    let isConnected = false;

    /* ---------- On Connect ---------- */
    socket.on("connect", () => {
      isConnected = true;
      statusBadge.className = "badge connected";
      statusBadge.textContent = "CONNECTED";
    });

    /* ---------- On Disconnect ---------- */
    socket.on("disconnect", () => {
      isConnected = false;
      statusBadge.className = "badge disconnected";
      statusBadge.textContent = "DISCONNECTED";
    });

    /* ---------- appendMessage ---------- */
    function appendMessage(text, isUser) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${isUser ? "user" : "assistant"}`;

      const avatar = document.createElement("div");
      avatar.className = `msg-avatar ${isUser ? "user" : "assistant"}`;
      avatar.textContent = isUser ? "U" : "B";

      const bubble = document.createElement("div");
      bubble.className = `msg-bubble ${isUser ? "user" : "assistant"}`;
      bubble.textContent = text;

      msgDiv.appendChild(avatar);
      msgDiv.appendChild(bubble);
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    /* ---------- command_result ---------- */
    socket.on("command_result", (data) => {
      if (data && data.message) {
        appendMessage(data.message, false);
      }
    });

    /* ---------- sendMsg ---------- */
    function sendMsg() {
      const input = document.getElementById("cmd-input");
      if (!input || !input.value.trim()) return;
      const text = input.value.trim();
      appendMessage(text, true);
      socket.emit("send_command", { command: text });
      input.value = "";
    }

    /* ---------- sendQuickCommand ---------- */
    function sendQuickCommand(cmdText) {
      const trimmed = (cmdText || "").trim();
      if (!trimmed) return;
      appendMessage(trimmed, true);
      socket.emit("send_command", { command: trimmed });
    }

    /* ---------- Enter Key Listener ---------- */
    cmdInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { sendMsg(); }
    });

    /* ---------- Initial health fetch ---------- */
    socket.emit("system_check", {});
  </script>
</body>
</html>
