<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Butler — macOS AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ---------- Design System: Clean macOS Dark Mode ---------- */
    :root {
      --bg: #0a0a12;
      --bg-secondary: #12121c;
      --bg-tertiary: #1a1a24;
      --fg: #eaeaea;
      --muted: #71717a;
      --accent: #00ffcc;
      --card: #1e1e2f;
      --border: rgba(0, 255, 204, 0.1);
      --success: #00ffcc;
      --warning: #f5a623;
      --error: #ff5f57;
    }

    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    html { height: 100%; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

    /* ---------- Main Layout: Flexbox ---------- */
    .main {
      max-width: 1400px; margin: 0 auto; padding: 24px;
      display: flex; flex-direction: column; gap: 24px; height: 100vh;
      overflow-y: auto;
    }

    /* ---------- Top Bar: Status + CPU/RAM ---------- */
    .header {
      display: flex; justify-content: space-between; align-items: center; padding: 12px 20px;
      background: var(--bg-secondary); border-radius: 16px; border: 1px solid var(--border);
    }

    .status-bar { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }

    .status-badge {
      display: inline-flex; padding: 6px 12px; border-radius: 20px; font-size: 11px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s;
    }
    .status-badge.connected { background: rgba(0, 255, 204, 0.12); color: var(--accent); border-color: var(--accent); }
    .status-badge.disconnected { background: rgba(255, 95, 87, 0.12); color: var(--error); border-color: var(--error); }

    .status-dot { width: 8px; height: 8px; border-radius: 50%; animation: pulse-soft 2s ease-in-out infinite; }
    .status-dot.connected { background: var(--accent); box-shadow: 0 0 16px rgba(0, 255, 204, 0.4); }
    .status-dot.disconnected { background: var(--error); box-shadow: 0 0 16px rgba(255, 95, 87, 0.4); }

    .status-text { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

    .cpu-ram { display: flex; gap: 16px; align-items: center; font-family: var(--mono); font-size: 12px; }
    .cpu-ram .label { color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .cpu-ram .value { color: var(--accent); min-width: 32px; }

    /* ---------- Chat Container (Flexbox, NO inline-block/fit-content) ---------- */
    .chat-container {
      flex: 1; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding: 12px;
      background: var(--bg-secondary); border-radius: 16px; border: 1px solid var(--border);
    }

    .message {
      display: flex; gap: 10px; align-items: flex-start; font-size: 14px;
      word-break: break-word; line-height: 1.4;
    }
    .message.user { align-self: flex-end; }
    .message.assistant { align-self: flex-start; }

    .message-avatar {
      width: 30px; height: 30px; border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
    }
    .message-avatar.user { background: var(--accent); color: var(--bg); }
    .message-avatar.assistant { background: var(--card); color: var(--muted); }

    .message-bubble {
      max-width: 70%; padding: 10px 16px; border-radius: 16px 16px 2px 16px;
      font-size: 14px; word-break: break-word; font-weight: 500;
    }
    .message-bubble.user { background: var(--accent); color: var(--bg); }
    .message-bubble.assistant { background: rgba(255, 255, 255, 0.05); color: var(--fg); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px 16px 16px 2px; }

    .message-meta { font-size: 10px; color: var(--muted); margin-top: 4px; }

    /* ---------- Quick Action Sidebar ---------- */
    .sidebar {
      flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; align-self: stretch;
      background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
    }
    .sidebar .title { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
    .sidebar .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; }
    .action-btn {
      padding: 10px 12px; border: none; border-radius: 14px; cursor: pointer;
      font-family: inherit; font-size: 12px; font-weight: 500; transition: background 0.15s;
      background: var(--bg-tertiary); color: var(--fg);
    }
    .action-btn:hover { background: var(--accent); color: var(--bg); }
    .action-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- Input Bar ---------- */
    .input-bar { flex-shrink: 0; display: flex; gap: 12px; align-items: center; padding: 12px 20px;
      background: var(--bg-secondary); border-radius: 20px; border: 1px solid var(--border); }
    .input-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 24px rgba(0, 255, 204, 0.2); }
    .input-field { flex: 1; padding: 10px 14px; background: var(--bg-tertiary); border: none; border-radius: 14px;
      color: var(--fg); font-size: 14px; font-family: var(--mono); resize: none; outline: none; }
    .input-field:focus { background: var(--bg-tertiary); }
    .input-field::placeholder { color: var(--muted); }
    .send-btn { padding: 0 20px; background: var(--accent); color: var(--bg); border: none; border-radius: 14px;
      font-weight: 600; font-size: 13px; cursor: pointer; min-width: 72px; transition: background 0.15s; }
    .send-btn:hover { background: #00e5bb; }
    .send-btn:focus-visible { outline: 2px solid var(--bg); outline-offset: 2px; }

    @media (max-width: 600px) {
      .main { padding: 16px; gap: 16px; }
      .header { padding: 10px 16px; }
      .sidebar { padding: 12px; }
      .input-bar { padding: 10px 16px; }
      .input-field { font-size: 13px; }
      .send-btn { min-width: 56px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div style="position:fixed;inset:0;pointer-events:none;background:
    radial-gradient(ellipse 100% 60% at 20% 20%, rgba(0,255,204,0.06), transparent 50%),
    radial-gradient(ellipse 80% 50% at 80% 80%, rgba(189,19,254,0.05), transparent 50%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-secondary) 100%); z-index:-1;"></div>

  <div class="main">
    <!-- ========= TOP BAR ========= -->
    <header class="header">
      <div class="status-bar">
        <div class="status-badge disconnected" id="status-badge">DISCONNECTED</div>
        <div class="status-dot disconnected" id="status-dot"></div>
        <span class="status-text">Disconnected</span>
        <div class="cpu-ram" id="cpu-ram">
          <span class="label">CPU</span><span class="value" id="cpu-val">--</span>%
          <span class="label">RAM</span><span class="value" id="mem-val">--</span>%
        </div>
      </div>
    </header>

    <!-- ========= CHAT CONTAINER ========= -->
    <div class="chat-container" id="chat-container">
      <!-- Messages injected by JS -->
    </div>

    <!-- ========= SIDEBAR: Quick Actions ========= -->
    <div class="sidebar">
      <div class="title">Quick Actions</div>
      <div class="actions">
        <button class="action-btn" onclick="sendCmd('open youtube')">YouTube</button>
        <button class="action-btn" onclick="sendCmd('open terminal')">Terminal</button>
        <button class="action-btn" onclick="sendCmd('open finder')">Finder</button>
        <button class="action-btn" onclick="sendCmd('mute')">Mute</button>
        <button class="action-btn" onclick="sendCmd('unmute')">Unmute</button>
        <button class="action-btn" onclick="sendCmd('system check')">System Check</button>
      </div>
    </div>
  </div>

    <!-- ========= INPUT BAR ========= -->
    <div class="input-bar">
      <input class="input-field" id="command-input" placeholder="Type a command…" autocomplete="off">
      <button class="send-btn" id="send-btn">Send</button>
    </div>
  </div>

  <!-- Socket.IO client -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    /* ---------- Socket.IO ---------- */
    const socket = io("http://127.0.0.1:5000", {
      transports: ["websocket", "polling"],
      reconnectionAttempts: 5,
      reconnectionDelay: 2000
    });

    /* ---------- DOM Elements ---------- */
    const statusBadge = document.getElementById("status-badge");
    const cpuVal = document.getElementById("cpu-val");
    const memVal = document.getElementById("mem-val");
    const chatContainer = document.getElementById("chat-container");
    const cmdInput = document.getElementById("command-input");
    const sendBtn = document.getElementById("send-btn");

    /* ---------- State ---------- */
    let isConnected = false;

    /* ---------- On Connect ---------- */
    socket.on("connect", () => {
      isConnected = true;
      statusBadge.className = "status-badge connected";
      statusBadge.textContent = "CONNECTED";
      statusDot.className = "status-dot connected";
      statusText.textContent = "Connected";
    });

    /* ---------- On Disconnect ---------- */
    socket.on("disconnect", () => {
      isConnected = false;
      statusBadge.className = "status-badge disconnected";
      statusBadge.textContent = "DISCONNECTED";
      statusDot.className = "status-dot disconnected";
      statusText.textContent = "DISCONNECTED";
    });

    /* ---------- Render Message ---------- */
    function addMessage(text, isUser) {
      const div = document.createElement("div");
      div.className = `message ${isUser ? "user" : "assistant"}`;

      const bubble = document.createElement("div");
      bubble.className = `message-bubble ${isUser ? "user" : "assistant"}`;
      bubble.textContent = text;

      div.appendChild(bubble);

      /* Avatar */
      const avatar = document.createElement("div");
      avatar.className = `message-avatar ${isUser ? "user" : "assistant"}`;
      avatar.textContent = isUser ? "U" : "B";
      div.insertBefore(avatar, bubble);

      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    /* ---------- command_result ---------- */
    socket.on("command_result", (data) => {
      const msg = data.message || "Command processed";
      addMessage(msg, true); /* User side */
    });

    /* ---------- system_check_response ---------- */
    socket.on("system_check_response", (data) => {
      if (cpuVal !== undefined) cpuVal.textContent = data.cpu || "--";
      if (memVal !== undefined) memVal.textContent = data.memory || "--";
    });

    /* ---------- Send Command (Enter or Button) ---------- */
    function sendCmd(text) {
      const trimmed = (text || "").trim();
      if (!trimmed) return;

      /* Append immediately to UI */
      addMessage(trimmed, true);

      /* Emit to backend */
      socket.emit("send_command", { command: trimmed });

      /* Clear input */
      cmdInput.value = "";
    }

    /* ---------- Enter Key ---------- */
    cmdInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { sendCmd(cmdInput.value); }
    });

    /* ---------- Initial health fetch ---------- */
    socket.emit("system_check", {});
  </script>
</body>
</html>
