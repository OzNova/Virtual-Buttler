<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Butler — macOS AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ---------- Design System: Modern Apple Dark Mode ---------- */
    :root {
      --bg: #0f0f1a;
      --bg-secondary: #1a1a2e;
      --bg-tertiary: #12121f;
      --fg: #eaeaea;
      --muted: #71717a;
      --accent: #00d4aa;
      --card: #1e1e2f;
      --border: rgba(0, 212, 170, 0.1);
      --success: #00d4aa;
      --warning: #f5a623;
      --error: #ff5f57;
    }

    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    html {
      height: 100%; -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

    /* ---------- Layout: CSS Grid ---------- */
    .main {
      max-width: 1400px; margin: 0 auto; padding: 32px 24px;
      display: grid;
      grid-template-areas:
        "header    header"
        "chat      actions"
        "input     actions";
      grid-template-columns: 1fr 220px;
      grid-template-rows: auto auto auto;
      gap: 24px; height: 100vh; overflow-y: auto;
    }

    /* ---------- Header: Status + System ---------- */
    .header {
      grid-area: header; display: flex; flex-direction: column; gap: 12px;
      align-items: stretch;
    }

    .header-top {
      width: 100%; display: flex; justify-content: space-between;
      align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }

    .status-bar {
      display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    }

    .status-badge {
      display: inline-flex; gap: 6px; padding: 8px 14px;
      border-radius: 20px; font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em;
      transition: all 0.2s ease; border: 1px solid var(--border);
    }
    .status-badge.connected {
      background: rgba(0, 212, 170, 0.12); color: var(--accent);
      border-color: var(--accent); box-shadow: 0 0 20px rgba(0, 212, 170, 0.3);
    }
    .status-badge.disconnected {
      background: rgba(95, 95, 95, 0.12); color: var(--muted);
      border-color: var(--muted);
    }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      animation: pulse-soft 2s ease-in-out infinite;
    }
    .status-dot.connected { background: var(--accent); box-shadow: 0 0 16px rgba(0, 212, 170, 0.4); }
    .status-dot.disconnected { background: var(--muted); }

    .status-text { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

    .cpu-ram { display: flex; gap: 16px; align-items: center; font-family: var(--mono); font-size: 12px; }
    .cpu-ram .label { color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .cpu-ram .value { color: var(--accent); min-width: 40px; }

    /* ---------- Chat Area ---------- */
    .chat-area {
      grid-area: chat; overflow-y: auto; padding-right: 8px; display: flex;
      flex-direction: column; gap: 12px; isolation: isolate;
    }

    /* ---------- Message Bubbles (NOT full width) ---------- */
    .user-message {
      max-width: 70%; width: fit-content; display: inline-block; clear: both;
      background: var(--accent); color: var(--bg); padding: 10px 14px;
      border-radius: 18px; margin-left: auto; font-size: 14px;
    }
    .assistant-message {
      max-width: 70%; width: fit-content; display: inline-block; clear: both;
      background: var(--card); color: var(--fg); padding: 10px 14px;
      border: 1px solid var(--border); border-radius: 18px; font-size: 14px;
    }
    .user-message { text-align: right; }
    .assistant-message { text-align: left; }

    .message { display: none; }
    .user-message, .assistant-message { display: block; }

    .message-avatar { display: none; }

    /* ---------- Quick Action Dock ---------- */
    .dock {
      grid-area: actions; display: flex; flex-direction: column; gap: 10px;
      align-items: stretch; padding: 20px; background: var(--card);
      border-radius: 20px; border: 1px solid var(--border); backdrop-filter: blur(8px);
    }
    .dock .title {
      font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px;
    }
    .dock .actions { width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; }
    .action-btn {
      padding: 10px 12px; border: none; border-radius: 14px; cursor: pointer;
      font-family: inherit; font-size: 12px; font-weight: 500; transition: all 0.18s ease;
      background: var(--bg-tertiary); color: var(--fg);
    }
    .action-btn:hover { background: var(--accent); color: var(--bg); transform: translateY(-1px); }
    .action-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- Input Bar ---------- */
    .input-bar {
      grid-area: input; display: flex; gap: 12px; align-items: center;
      padding: 16px 20px; background: var(--bg-secondary); border-radius: 20px;
      border: 1px solid var(--border); backdrop-filter: blur(8px);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-bar.expanded { gap: 8px; }
    .input-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 24px rgba(0, 212, 170, 0.2); }
    .input-field {
      flex: 1; padding: 10px 14px; background: var(--bg-tertiary); border: none;
      border-radius: 16px; color: var(--fg); font-size: 14px; font-family: var(--mono);
      resize: none; outline: none; transition: background 0.15s;
    }
    .input-field:focus { background: var(--bg-tertiary); }
    .input-field::placeholder { color: var(--muted); }
    .send-btn {
      padding: 0 20px; background: var(--accent); color: var(--bg);
      border: none; border-radius: 16px; font-weight: 600; font-size: 13px;
      cursor: pointer; min-width: 72px; transition: background 0.15s, transform 0.1s;
    }
    .send-btn:hover { background: #00e5bb; transform: translateY(-1px); }
    .send-btn:focus-visible { outline: 2px solid var(--bg); outline-offset: 2px; }

    /* ---------- Helpers ---------- */
    .hide { display: none !important; }
    .mono { font-family: var(--mono); }

    @media (max-width: 600px) {
      .main { grid-template-columns: 1fr; grid-template-rows: auto auto auto auto; gap: 16px; }
      .header-top { flex-direction: column; gap: 8px; }
      .dock { width: 100%; order: 3; }
      .input-bar { order: 4; }
    }
  </style>
</head>
<body>
  <div style="position:fixed;inset:0;pointer-events:none;background:
    radial-gradient(ellipse 100% 60% at 20% 20%, rgba(0,212,170,0.08), transparent 50%),
    radial-gradient(ellipse 80% 50% at 80% 80%, rgba(189,19,254,0.06), transparent 50%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-secondary) 100%); z-index:-1;"></div>

  <div class="main">
    <!-- ========= HEADER ========= -->
    <header class="header">
      <div class="header-top">
        <div class="status-bar">
          <div class="status-badge disconnected" id="status-badge">DISCONNECTED</div>
          <div class="status-dot disconnected" id="status-dot"></div>
          <span class="status-text">Disconnected</span>
        </div>
        <div class="cpu-ram" id="cpu-ram">
          <span class="label">CPU</span><span class="value" id="cpu-val">--</span>%
          <span class="label">RAM</span><span class="value" id="mem-val">--</span>%
        </div>
      </div>
    </header>

    <!-- ========= CHAT AREA ========= -->
    <div class="chat-area" id="chat-area">
      <div class="message assistant">
        <div class="message-avatar assistant">BUT</div>
        <div class="message-bubble assistant">
          Hello sir! Virtual Butler is ready. How may I assist you today?
        </div>
        <div class="message-meta assistant">Just now</div>
      </div>
    </div>

    <!-- ========= QUICK ACTION DOCK ========= -->
    <div class="dock">
      <div class="title">Quick Actions</div>
      <div class="actions">
        <button class="action-btn" onclick="sendCmd('open youtube')">YouTube</button>
        <button class="action-btn" onclick="sendCmd('open terminal')">Terminal</button>
        <button class="action-btn" onclick="sendCmd('system check')">System</button>
        <button class="action-btn" onclick="sendCmd('open finder')">Finder</button>
        <button class="action-btn" onclick="sendCmd('mute volume')">Mute</button>
      </div>
    </div>

    <!-- ========= INPUT BAR ========= -->
    <div class="input-bar" id="input-bar">
      <input class="input-field" id="command-input" placeholder="Type a command…" autocomplete="off">
      <button class="send-btn" id="send-btn">Send</button>
    </div>
  </main>

  <!-- Socket.IO client -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    /* ---------- Socket.IO ---------- */
    const socket = io("http://127.0.0.1:5000", {
      transports: ["websocket", "polling"],
      reconnectionAttempts: 5,
      reconnectionDelay: 2000
    });

    /* ---------- DOM Elements ---------- */
    const statusBadge = document.getElementById("status-badge");
    const cpuVal = document.getElementById("cpu-val");
    const memVal = document.getElementById("mem-val");
    const chatArea = document.getElementById("chat-area");
    const cmdInput = document.getElementById("command-input");
    const sendBtn = document.getElementById("send-btn");

    /* ---------- State ---------- */
    let isConnected = false;

    /* ---------- On Connect ---------- */
    socket.on("connect", () => {
      isConnected = true;
      statusBadge.className = "status-badge connected";
      statusBadge.textContent = "CONNECTED";
      updateHealth();
    });

    /* ---------- On Disconnect ---------- */
    socket.on("disconnect", () => {
      isConnected = false;
      statusBadge.className = "status-badge disconnected";
      statusBadge.textContent = "DISCONNECTED";
    });

    /* ---------- Health Pulse (CPU/RAM) ---------- */
    function updateHealth() {
      socket.emit("system_check", {});
      setTimeout(updateHealth, 3000);
    }

    /* ---------- Render Message ---------- */
    function addMessage(text, isUser = false) {
      const div = document.createElement("div");
      div.className = isUser ? "user-message" : "assistant-message";

      div.innerHTML = escapeHtml(text);

      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function escapeHtml(t) {
      const d = document.createElement("div"); d.textContent = t; return d.innerHTML;
    }
    function formatTime() { return new Date().toLocaleTimeString([], {minute:"2-digit",second:"2-digit"}); }

    /* ---------- command_result ---------- */
    socket.on("command_result", (data) => {
      const msg = data.message || "Command processed";
      addMessage(msg, true);
    });

    /* ---------- system_check_response ---------- */
    socket.on("system_check_response", (data) => {
      if (cpuVal !== undefined) cpuVal.textContent = data.cpu || "--";
      if (memVal !== undefined) memVal.textContent = data.memory || "--";
    });

    /* ---------- Send Command ---------- */
    function sendCmd(text) {
      const trimmed = (text || "").trim();
      if (!trimmed) return;

      // Append immediately to UI
      addMessage(trimmed, true);

      // Emit to backend
      socket.emit("send_command", { text: trimmed });

      // Clear input
      cmdInput.value = "";
    }

    /* ---------- Enter key ---------- */
    cmdInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { sendCmd(cmdInput.value); }
    });

    /* ---------- Initial health fetch ---------- */
    socket.emit("system_check", {});
  </script>
</body>
</html>
